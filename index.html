<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kris41's Repo</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #ffffff;
        }
        p.sub {
            margin: 0;
            color: #aaaaaa;
            font-size: 14px;
        }
        .buttons {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background-color: #007aff;
            color: #ffffff;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .card {
            background-color: #2c2c2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #3a3a3c;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .card-desc {
            font-size: 13px;
            color: #cccccc;
            margin: 0;
        }
        .badge {
            display: inline-block;
            background-color: #3a3a3c;
            color: #0a84ff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Kris41's Repo</h1>
        <p class="sub">Репозиторий твиков для iOS 6+</p>
    </div>

    <div class="buttons">
        <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://krisdev412.github.io/my-repo/" class="btn">Добавить в Cydia</a>
        <a href="sileo://source/https://krisdev412.github.io/my-repo/" class="btn">Добавить в Sileo</a>
    </div>

    <h3 style="color: #8e8e93; font-size: 14px; text-transform: uppercase;">Доступные твики</h3>

    <div class="card">
        <div class="card-title">NoSlider</div>
        <p class="card-desc">Кастомный твик NoSlider для убирания слайдера.</p>
        <div class="badge">v1.0</div>
    </div>

    <div class="card">
        <div class="card-title">Kumo</div>
        <p class="card-desc">Кастомный твик Kumo.</p>
        <div class="badge">v1.0</div>
    </div>

</body>
</html>
