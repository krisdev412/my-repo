    <title>Kris41's Repo</title>
    <style>
        body {
            font-family: -apple-system, Helvetica, Arial, sans-serif;
            /* Путь к твоей картинке на фоне */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
        }
        .header {
            text-align: center;
            padding: 25px 10px;
            background: rgba(30, 30, 36, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: #ffffff;
        }
        p.sub {
            margin: 0;
            color: #98989f;
            font-size: 14px;
        }
        .buttons {
            text-align: center;
            margin: 15px 0;
        }
        .btn {
            display: inline-block;
            background-color: #0a84ff;
            color: #ffffff;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(10, 132, 255, 0.3);
        }
        .btn:active {
            opacity: 0.7;
        }
        .section-title {
            color: #8e8e93;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 5px 10px 5px;
            font-weight: bold;
        }
        .card {
            background-color: rgba(28, 28, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-info {
            flex-grow: 1;
            margin-right: 10px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 13px;
            color: #aeaeb2;
            margin: 0;
            line-height: 1.3;
        }
        .card-right {
            text-align: right;
            min-width: 70px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(44, 44, 46, 0.8);
            color: #0a84ff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .details-btn {
            background-color: #3a3a3c;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1c1c1e;
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #3a3a3c;
        }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        .modal-desc { font-size: 13px; color: #aeaeb2; margin-bottom: 15px; line-height: 1.4; }
        .close-btn {
            background: #0a84ff; color: #fff; border: none;
            padding: 8px 14px; border-radius: 8px; font-weight: bold; width: 100%;
            cursor: pointer;
        }
    </style>
</head>
